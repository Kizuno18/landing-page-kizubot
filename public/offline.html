<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#A855F7" />
    <meta name="robots" content="noindex" />
    <title>Você está offline · KizuBot</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
        background: radial-gradient(80% 60% at 50% 40%, #23103f 0%, #0b0614 55%, #000 100%);
        color: #e7e3ee;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 28rem;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 1rem;
        box-shadow: 0 10px 40px rgba(168, 85, 247, 0.25);
      }
      h1 {
        margin: 1.75rem 0 0.75rem;
        font-size: 1.6rem;
        color: #c084fc;
        font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo,
          monospace;
      }
      p {
        margin: 0 0 2rem;
        line-height: 1.6;
        color: #a8a1b8;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        color: #18091f;
        background: #a855f7;
        padding: 0.85rem 1.75rem;
        border-radius: 0.5rem;
        transition: background-color 0.15s ease;
      }
      button:hover {
        background: #9333ea;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="KizuBot" width="96" height="96" />
      <h1>Você está offline</h1>
      <p>
        Não foi possível carregar esta página porque você está sem conexão. As
        páginas que você já visitou continuam disponíveis. Reconecte-se e tente
        novamente.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
